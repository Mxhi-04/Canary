name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m eval.backtest --no-charts --output-dir /tmp/canary-eval
      - run: uv run python scripts/check_report.py /tmp/canary-eval/summary.json
      - name: Build and smoke-test Docker Compose
        run: |
          docker compose up --build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8000/healthz | jq -e '.mode == "synthetic_demo"'
          curl --fail --silent 'http://127.0.0.1:8000/replay/respiratory?day=16' | jq -e '.markers.canary | length > 0'
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down
