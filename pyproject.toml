[project]
name = "canary-health"
version = "0.1.0"
description = "Explainable early warning for population and workforce health"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<25",
  "pyyaml>=6,<7",
  "scipy>=1.15,<2",
  "statsmodels>=0.14.4,<0.15",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
